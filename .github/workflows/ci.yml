name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python -m pip install --disable-pip-version-check -e .
      - run: make verify
      - name: Build and verify installed wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/harness-wheels"
          python -m venv "$RUNNER_TEMP/harness-wheel-venv"
          "$RUNNER_TEMP/harness-wheel-venv/bin/pip" install --no-index --no-deps "$RUNNER_TEMP"/harness-wheels/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/harness-wheel-venv/bin/harness" factory-demo --output "$RUNNER_TEMP/harness-installed-demo"
